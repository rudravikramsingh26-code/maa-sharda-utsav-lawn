<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>माँ शारदा उत्सव लॉन — 3D Venue Virtual Tour</title>
<link rel="icon" type="image/png" href="images/brand/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<script src="js/three/three.min.js"></script>
<script src="js/three/controls/OrbitControls.js"></script>
<script src="js/three/postprocessing/EffectComposer.js"></script>
<script src="js/three/postprocessing/RenderPass.js"></script>
<script src="js/three/postprocessing/ShaderPass.js"></script>
<script src="js/three/postprocessing/UnrealBloomPass.js"></script>
<script src="js/three/shaders/CopyShader.js"></script>

<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#05070f;color:#eaf4ff;font-family:Inter,system-ui,sans-serif;user-select:none}
canvas{display:block;touch-action:none}
.g{background:rgba(8,14,30,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,190,90,.35);border-radius:16px;box-shadow:0 8px 30px #0009}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto;padding:8px 14px}
h1{font:700 13px Orbitron,sans-serif;letter-spacing:.08em;color:#ffd27a}
p{font-size:10px;opacity:.75;margin-top:2px}
button,a.back-btn{font:600 12px inherit;color:#fff;background:rgba(40,30,20,.55);border:1px solid rgba(255,190,90,.3);border-radius:12px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:.2s;text-decoration:none;display:inline-flex;align-items:center}
button:hover,button.on,a.back-btn:hover{background:rgba(255,170,60,.3);border-color:#ffd27a}
#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;max-width:96vw;overflow-x:auto;z-index:5;scrollbar-width:none;-ms-overflow-style:none;}
#nav::-webkit-scrollbar{display:none;}
#nav button{padding:6px 10px;font-size:11px;}
#lab{position:fixed;inset:0;pointer-events:none;z-index:4}
.l{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(10,12,24,.84);border:1px solid #ffd27a;color:#ffe9b8;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 0 12px #ffb34755;transition:opacity .15s}
.l:hover{background:rgba(255,170,60,.35)}
#hint{position:fixed;top:72px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:12px;color:#ffd27a;display:none;z-index:6}
</style>
</head>
<body>
<div id="lab"></div>
<div id="hint" class="g">Click anywhere on the 3D venue to place a custom pin</div>
<div id="top">
  <div class="g">
    <h1>माँ शारदा उत्सव लॉन</h1>
    <p>Drag to rotate • Scroll / pinch to zoom • Click a label to rename</p>
  </div>
  <div class="g" style="display:flex;gap:6px;padding:6px;flex-wrap:wrap;align-items:center">
    <a href="index.html" class="back-btn">← Main Website</a>
    <button id="bR" class="on">🏛️ Realistic</button>
    <button id="bY">🎨 Hybrid</button>
    <button id="bH">⚡ Hologram</button>
    <button id="bA" class="on" title="Auto Rotate">🔄</button>
    <button id="bL" class="on" title="Toggle Labels">🏷️</button>
    <button id="bP" title="Add Custom Pin">+ Pin</button>
  </div>
</div>
<div id="nav" class="g"></div>

<script>
const V=THREE.Vector3,R=Math.random;
let scene,camera,renderer,composer,bloom,controls,sky,stars,grid,mode='real',showL=true,placingPin=false,anim=null,cars=[],pl=[];
const venue=new THREE.Group(),holoWire=new THREE.Group(),FL=[],raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();

// ---------- helpers ----------
const T=(w,h,f,rx=1,ry=1)=>{
  const c=document.createElement('canvas');c.width=w;c.height=h;
  f(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t;
};
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o));
const add=(g,m,x,y,z,p=venue)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const Bx=(w,h,d,m,x,y,z,p)=>add(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const Cy=(a,b,h,s,m,x,y,z,p)=>add(new THREE.CylinderGeometry(a,b,h,s),m,x,y,z,p);
const strand=(a,b,n,sag=0)=>{
  for(let i=0;i<=n;i++){
    const t=n?i/n:0;
    FL.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t-Math.sin(t*Math.PI)*sag,a[2]+(b[2]-a[2])*t]);
  }
};
const spk=(c,w,h,n,f)=>{for(let i=0;i<n;i++){c.fillStyle=f();c.fillRect(R()*w,R()*h,2,2)}};
const logo=(c,x,y,r)=>{
  c.fillStyle='#d7141a';c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.strokeStyle='#ff8a4a';c.lineWidth=r/14;c.stroke();
  c.fillStyle='#fff';
  [-1,1].forEach(s=>{c.beginPath();c.ellipse(x+s*r*.33,y-r*.1,r*.26,r*.12,0,0,7);c.fill()});
  c.fillStyle='#ffe9a8';c.beginPath();c.ellipse(x,y-r*.55,r*.07,r*.15,0,0,7);c.fill();
  c.strokeStyle='#fff';c.lineWidth=r/16;c.beginPath();c.arc(x,y+r*.35,r*.2,.2,2.9);c.stroke();
};

// ---------- textures ----------
function textures(){
  return{
    grass:T(256,256,(c,w,h)=>{c.fillStyle='#2c5826';c.fillRect(0,0,w,h);spk(c,w,h,6000,()=>`hsl(${85+R()*35},45%,${14+R()*18}%)`)},14,10),
    soil:T(256,256,(c,w,h)=>{c.fillStyle='#4b4232';c.fillRect(0,0,w,h);spk(c,w,h,5000,()=>`hsl(${30+R()*20},25%,${14+R()*14}%)`)},70,70),
    road:T(256,256,(c,w,h)=>{c.fillStyle='#262a31';c.fillRect(0,0,w,h);spk(c,w,h,5000,()=>`hsl(220,8%,${12+R()*22}%)`)},10,2),
    carpet:T(128,128,(c,w,h)=>{
      c.fillStyle='#a8101c';c.fillRect(0,0,w,h);
      const d=(s,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(w/2,h/2-s);c.lineTo(w/2+s,h/2);c.lineTo(w/2,h/2+s);c.lineTo(w/2-s,h/2);c.fill()};
      d(58,'#ee7a1a');d(40,'#8c0c18');d(22,'#f2b134');d(8,'#a8101c');
    },3,8),
    stripes:T(512,256,(c,w,h)=>{
      const k=['#e8261f','#f59b1b','#ffd51f','#1fa84f','#1f7fe0','#8a3cc0','#e8318a','#f26a1f'];
      const n=24,sw=w/n;
      for(let i=0;i<n;i++){
        const g=c.createLinearGradient(i*sw,0,(i+1)*sw,0);
        g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.35,k[i%8]);g.addColorStop(.7,k[i%8]);g.addColorStop(1,'rgba(0,0,0,.5)');
        c.fillStyle=g;c.fillRect(i*sw,0,sw+1,h);
      }
    }),
    valance:T(512,64,(c,w,h)=>{
      c.fillStyle='#f5c43a';c.fillRect(0,0,w,h);
      for(let i=0;i<8;i++){c.fillStyle=i%2?'#fff':'#fbe9b0';c.beginPath();c.arc(i*64+32,10,34,0,Math.PI);c.fill()}
    }),
    sign:T(1024,200,(c,w,h)=>{
      c.fillStyle='#f2b705';c.fillRect(0,0,w,h);
      c.strokeStyle='#c98a00';c.lineWidth=8;c.strokeRect(6,6,w-12,h-12);
      c.font='800 112px "Noto Sans Devanagari",sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillStyle='#e8401c';c.fillText('माँ शारदा',250,112);c.fillText('उत्सव लॉन',790,112);
      logo(c,520,100,80);
    }),
    led:T(512,200,(c,w,h)=>{
      const g=c.createLinearGradient(0,0,w,h);
      g.addColorStop(0,'#7a0a3a');g.addColorStop(.5,'#d9239a');g.addColorStop(1,'#ff9a2a');
      c.fillStyle=g;c.fillRect(0,0,w,h);
      c.font='800 84px "Noto Sans Devanagari",sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillStyle='#fff3c9';c.fillText('शुभ विवाह',w/2,h/2);
    })
  };
}

// ---------- build venue ----------
function build(){
  const X=textures(),wall=M(0xf3efe6,{roughness:.9}),white=M(0xffffff,{roughness:.7}),glow=(c,i=1)=>M(c,{emissive:c,emissiveIntensity:i});
  scene.add(venue);

  // Ground, highway, parking & driveway
  add(new THREE.PlaneGeometry(700,700),M(0xffffff,{map:X.soil}),0,-.06,0).rotation.x=-Math.PI/2;
  Bx(130,.2,9,M(0xffffff,{map:X.road}),-4,.05,40.5);
  for(let x=-58;x<=52;x+=6)Bx(2.8,.05,.25,M(0xffd166,{emissive:0x886611}),x,.17,40.5);
  Bx(44,.2,16.5,M(0xffffff,{map:X.road,roughness:.95}),0,.08,26.25);
  Bx(9.2,.22,18.2,M(0x4a505c,{roughness:.9}),0,.1,27.1);
  Bx(44,.18,14,M(0xffffff,{map:X.grass}),0,.06,3);
  Bx(58,.18,24,M(0xffffff,{map:X.grass}),-7,.06,-16);

  // Outer highway gate
  [-5.2,5.2].forEach(x=>Bx(1.1,5.2,1.1,wall,x,2.6,34.5));
  Bx(12.2,1.2,1.4,M(0x7a1220),0,5.4,34.5);
  Bx(10.5,.3,1.5,glow(0xffc24a,1.4),0,5.4,34.5);

  // Entrance wings + painted terrace
  [-12.75,12.75].forEach(x=>{
    Bx(18.5,4.8,8.2,wall,x,2.4,14);
    for(let w=-6;w<=6;w+=4)Bx(1.8,1.7,.15,M(0x9fd4ff,{emissive:0x1b4a7a,emissiveIntensity:.8,roughness:.1,metalness:.5}),x+w,2.4,18.12);
  });
  Bx(7,1.2,8.2,wall,0,4.2,14);
  Bx(43.2,.18,7.6,M(0x334e68,{roughness:.5}),0,4.95,14);
  [-13,0,13].forEach((x,i)=>Bx(9.5,.22,5.4,M(i===1?0x2e7d6b:0xc25e3e,{roughness:.55}),x,5.05,14));
  Bx(44,.8,.35,white,0,5.4,18);
  Bx(44,.8,.35,white,0,5.4,10);

  // LED wash lights on front wings
  [[-12.75,0x9b4dff],[12.75,0x3cff7a]].forEach(([x,c])=>Bx(18,.2,.2,glow(c,1.5),x,4.5,18.3));
  Bx(7,.2,.2,glow(0xff8a2a,1.5),0,4.5,18.3);

  // Signboard
  const sg=new THREE.MeshStandardMaterial({map:X.sign,emissiveMap:X.sign,emissive:0xffffff,emissiveIntensity:.75,roughness:.5});
  Bx(12,2.3,.5,M(0x3a2a10),0,6.9,17.6);
  add(new THREE.PlaneGeometry(11.6,2.1),sg,0,6.9,17.87);

  // Striped curtain entrance + valance + red carpet tunnel
  add(new THREE.PlaneGeometry(6.4,3.4),M(0xffffff,{map:X.stripes,side:2,roughness:.95}),0,1.9,18.15);
  add(new THREE.PlaneGeometry(6.6,.9),M(0xffffff,{map:X.valance,side:2,emissive:0x442200}),0,3.75,18.2);
  Bx(6.4,.1,8.2,M(0xffffff,{map:X.carpet,roughness:1}),0,.14,14);
  Bx(4.6,.1,15.5,M(0xffffff,{map:X.carpet,roughness:1}),0,.14,2.5);

  // Hedges + fairy lights
  [-2.8,2.8].forEach(x=>{
    Bx(.9,.9,13.5,M(0x1b6a2c,{roughness:1}),x,.55,2.8);
    strand([x,1.15,-3.5],[x,1.15,9.5],14);
  });
  strand([-22,5.9,18.2],[22,5.9,18.2],40,.3);
  for(let x=-21;x<=21;x+=1.4)if(Math.abs(x)>4)strand([x,5.8,18.4],[x,3,18.4],4,0);

  // Side canopies
  [-12.5,12.5].forEach(x=>{
    Bx(9.5,3.2,8.5,white,x,1.6,4);
    const r=add(new THREE.ConeGeometry(6.8,1.9,4),white,x,4.15,4);r.rotation.y=Math.PI/4;
    strand([x-4.7,3.3,-.3],[x+4.7,3.3,-.3],8,.3);
  });

  // Banquet hall
  const H=new THREE.Group();H.position.set(17,0,-14);venue.add(H);
  Bx(.6,5.8,20,wall,6.7,2.9,0,H);
  [-9.7,9.7].forEach(z=>Bx(14,5.8,.6,wall,0,2.9,z,H));
  for(let z=-9;z<=9;z+=4.5)Cy(.34,.38,5.8,12,M(0xfef3c7),-6.7,2.9,z,H);
  const rs=new THREE.Shape();rs.moveTo(-7.8,0);rs.lineTo(0,3.2);rs.lineTo(7.8,0);rs.closePath();
  const rg=new THREE.ExtrudeGeometry(rs,{depth:20.8,bevelEnabled:false});
  rg.translate(0,5.8,-10.4);
  add(rg,M(0x7a1618,{roughness:.6}),0,0,0,H);
  Bx(3,.1,18,M(0xffffff,{map:X.carpet}),0,.14,0,H);

  const ch=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.8,1.1),white,36);
  let k=0;const mx=new THREE.Matrix4();
  for(let x=-4.5;x<=4.5;x+=2.2)for(let z=-6;z<=6;z+=2.4){
    if(Math.abs(z)<1.5||k>=36)continue;
    mx.setPosition(17+x,.5,-14+z);ch.setMatrixAt(k++,mx);
  }
  ch.count=k;ch.castShadow=true;venue.add(ch);
  strand([10.3,5.7,-23.5],[10.3,5.7,-4.5],24,.4);

  // Mandap & lawn seating
  const MD=new THREE.Group();MD.position.set(-14,0,-15);venue.add(MD);
  Cy(4.6,5,.7,10,M(0xf59e0b,{emissive:0x5a3000}),0,.45,0,MD);
  [[-2.6,-2.6],[2.6,-2.6],[-2.6,2.6],[2.6,2.6]].forEach(p=>Cy(.24,.3,4.4,10,M(0xf5c04a,{metalness:.7,roughness:.3}),p[0],2.9,p[1],MD));
  add(new THREE.ConeGeometry(4.8,2.4,10),M(0xd97706,{emissive:0x7a3a00,emissiveIntensity:.8}),0,6.2,0,MD);
  const mt=add(new THREE.TorusGeometry(3.7,.22,8,32),glow(0xff8a1a,1.1),0,4.9,0,MD);mt.rotation.x=Math.PI/2;
  Bx(3,.15,3,M(0xb01020),0,.85,0,MD);

  const tb=new THREE.InstancedMesh(new THREE.CylinderGeometry(1.15,1.15,.9,16),M(0xfff3f6,{roughness:.9}),8);
  [[-24,-10],[-24,-18],[-19,-22],[-10,-22],[-5,-14],[-6,-8],[-19,-8],[-27,-14]].forEach((p,i)=>{
    mx.setPosition(p[0],.5,p[1]);tb.setMatrixAt(i,mx);
    strand([p[0]-.4,1.1,p[1]],[p[0]+.4,1.1,p[1]],2,0);
  });
  tb.castShadow=true;venue.add(tb);

  // Main stage + LED screen
  Bx(13.5,1.3,4.6,M(0x7a1018),-3,.65,-25.8);
  Bx(12,4.6,.4,new THREE.MeshStandardMaterial({map:X.led,emissiveMap:X.led,emissive:0xffffff,emissiveIntensity:1.1}),-3,3.6,-27.4);
  [-9.2,3.2].forEach(x=>Cy(.12,.12,6,8,M(0x888c96,{metalness:.8,roughness:.3}),x,3,-27));

  // Kitchen block + stalls + mixed uncolored/painted border walls
  Bx(6.5,4.2,32,wall,-39.2,2.1,-12);
  Bx(7.2,.45,32.6,M(0x56606e),-39.2,4.4,-12);
  for(let z=-24;z<=-6;z+=4.5)Bx(2.8,2.6,3.6,white,-33.8,1.35,z);
  Bx(60,2.6,.35,M(0x9ca3af,{roughness:.95}),-7,1.3,-28.2); // uncolored concrete back border
  Bx(14.5,2.4,.45,M(0x7a1018),-29,1.2,4); // painted accent border
  [-22,22].forEach(x=>{
    Bx(.45,1.5,16.5,M(0x9ca3af,{roughness:.95}),x,.8,26.25);
    for(let z=19;z<=34;z+=3.2)strand([x,1.8,z],[x,1.8,z],0);
  });
  [-13.6,13.6].forEach(x=>Bx(16.8,1.5,.45,wall,x,.8,34.5));

  // Parked cars
  const car=(x,z,r,c)=>{
    const g=new THREE.Group();g.position.set(x,.2,z);g.rotation.y=r;
    Bx(1.9,.7,4,M(c,{metalness:.6,roughness:.3}),0,.55,0,g);
    Bx(1.6,.55,2,M(0x14202e,{metalness:.8,roughness:.1}),0,1.15,-.2,g);
    Bx(1.5,.15,.1,glow(0xfff3b0,1.5),0,.55,2.02,g);
    Bx(1.5,.12,.1,glow(0xff2020,1),0,.6,-2.02,g);
    venue.add(g);
  };
  [[-17,23,1.57,0xf1f5f9],[-17,27,1.57,0x64748b],[-17,31,1.57,0xa8b0bc],[-10,23,1.57,0xe2e8f0],[-10,29,1.57,0x2a3140],[10,23,-1.57,0xe8edf2],[10,28,-1.57,0x7a1018],[17,23,-1.57,0x9aa3b0],[17,28,-1.57,0xf8fafc],[17,32,-1.57,0x30384a]].forEach(c=>car(...c));

  // Highway traffic
  for(let i=0;i<8;i++){
    const d=Bx(1.8,.4,.9,glow(i%2?0xff3a3a:0xfff0b0,2),-55+i*14,.45,i%2?42.4:38.6);
    d.userData.s=i%2?-.3:.25;cars.push(d);
  }

  // Lamp posts
  [[-6,20],[6,20],[-6,33],[6,33]].forEach(p=>{
    Cy(.1,.12,6,8,M(0x333640),p[0],3,p[1]);
    add(new THREE.SphereGeometry(.35,10,10),glow(0xffe2a0,2),p[0],6.1,p[1]);
  });

  // Surrounding trees
  for(let i=0;i<46;i++){
    const a=i/46*6.283,r=58+R()*26,x=-6+Math.cos(a)*r*1.15,z=2+Math.sin(a)*r*.85;
    if(z>28&&z<50)continue;
    const s=.8+R()*.8;
    Cy(.25*s,.35*s,3*s,6,M(0x3a2a1a),x,1.5*s,z);
    add(new THREE.IcosahedronGeometry(2.4*s,1),M(0x1d4a24,{flatShading:true,roughness:1}),x,4.2*s,z);
  }

  // Fairy lights
  const fm=new THREE.InstancedMesh(new THREE.SphereGeometry(.11,6,6),new THREE.MeshBasicMaterial({color:0xffe6a8}),FL.length);
  FL.forEach((p,i)=>{mx.setPosition(p[0],p[1],p[2]);fm.setMatrixAt(i,mx)});
  venue.add(fm);

  // Hybrid wireframe overlay
  holoWire.visible=false;
  const edgeMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:.35});
  venue.traverse(o=>{
    if(o.isMesh&&!o.isInstancedMesh&&o.geometry){
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),edgeMat);
      e.position.copy(o.getWorldPosition(new V()));
      holoWire.add(e);
    }
  });
  scene.add(holoWire);
}

// ---------- zones & presets ----------
const zones=[
  ['🚗 वाहन पार्किंग',0,5.5,27,[20,14,54],[0,2,27]],
  ['💍 सगाई स्थल',0,9,16,[0,8,30],[0,5,17]],
  ['🤵 वर निवास (बाईं ओर)',-12.75,3.2,14,[-25,10,25],[-12.75,2,14]],
  ['👰 वधू निवास (दाईं ओर)',12.75,3.2,14,[25,10,25],[12.75,2,14]],
  ['🟥 लाल कालीन',0,3.5,3,[-16,12,16],[0,1,3]],
  ['💐 जयमाला स्थल',17,8.5,-14,[-8,16,2],[15,3,-14]],
  ['📸 सजावट एवं सेल्फ़ी स्थल',-14,8.5,-15,[4,16,4],[-14,2,-15]],
  ['🎤 मुख्य मंच',-3,7,-26,[-16,13,-6],[-3,3,-26]],
  ['🍽️ रसोईघर',-39,6.5,-12,[-12,20,8],[-36,2,-12]]
];
const presets=[
  ['🌐 360° Overview',[54,40,58],[-6,2,2]],
  ...zones.map(z=>[z[0],z[4],z[5]]),
  ['📐 Top View',[-6,95,6],[-6,0,2]]
];

function init(){
  scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x3b3354,.0032);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,900);
  camera.position.set(...presets[0][1]);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.target.set(...presets[0][2]);
  controls.enableDamping=true;controls.dampingFactor=.06;
  controls.maxPolarAngle=Math.PI/2-.03;controls.minDistance=10;controls.maxDistance=150;
  controls.autoRotate=true;controls.autoRotateSpeed=.6;
  controls.addEventListener('start',()=>anim=null);

  // Twilight sky dome + stars
  sky=new THREE.Mesh(new THREE.SphereGeometry(450,32,16),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,
    vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 p;void main(){float h=clamp(p.y,0.,1.);vec3 c=mix(vec3(1.,.5,.26),vec3(.42,.3,.5),smoothstep(0.,.16,h));c=mix(c,vec3(.03,.07,.2),smoothstep(.1,.55,h));gl_FragColor=vec4(c,1.);}'
  }));
  scene.add(sky);

  const sp=[];
  for(let i=0;i<700;i++){const a=R()*6.283,e=.25+R()*1.2;sp.push(Math.cos(a)*Math.cos(e)*420,Math.sin(e)*420,Math.sin(a)*Math.cos(e)*420)}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.4,fog:false,transparent:true,opacity:.8}));
  scene.add(stars);

  grid=new THREE.GridHelper(160,64,0x00e5ff,0x0a2540);grid.visible=false;scene.add(grid);

  // Lights
  scene.add(new THREE.HemisphereLight(0x7b86c8,0x2a2216,.7));
  const sun=new THREE.DirectionalLight(0xffb98a,.9);
  sun.position.set(60,38,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:5,far:220});
  sun.shadow.bias=-.0006;scene.add(sun);

  [[0xffa24a,1.8,28,0,3.5,15],[0xffb347,2.2,42,-14,7,-15],[0xffa860,1.6,32,17,5,-14],[0xff40b0,1.6,26,-3,6,-23],[0x9b4dff,1.8,16,-12.7,3,20],[0x3cff7a,1.6,16,12.7,3,20],[0xff3b3b,.9,14,0,1.2,3]].forEach(l=>{
    const p=new THREE.PointLight(l[0],l[1],l[2]);p.position.set(l[3],l[4],l[5]);scene.add(p);pl.push(p);
  });

  // Postprocessing bloom
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.92);
  composer.addPass(bloom);

  build();ui();animate();
}

// ---------- UI & interactions ----------
function fly(p,t){anim={a:camera.position.clone(),b:new V(...p),c:controls.target.clone(),d:new V(...t),k:0}}

function setMode(m){
  mode=m;
  const isHolo=m==='holo',isHyb=m==='hybrid';
  scene.overrideMaterial=isHolo?new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.45}):null;
  holoWire.visible=isHyb;
  sky.visible=stars.visible=!isHolo;
  grid.visible=isHolo||isHyb;
  scene.background=isHolo?new THREE.Color(0x040812):null;
  scene.fog.color.setHex(isHolo?0x040812:0x3b3354);
  bloom.strength=isHolo?.55:.8;
  bR.classList.toggle('on',m==='real');
  bY.classList.toggle('on',isHyb);
  bH.classList.toggle('on',isHolo);
}

function addLabelEl(z){
  const e=document.createElement('div');
  e.className='l';e.textContent=z[0];
  e.onclick=()=>{
    controls.autoRotate=false;bA.classList.remove('on');
    if(z[4]&&z[5])fly(z[4],z[5]);
    const name=prompt('Rename label:',z[0]);
    if(name&&name.trim()){z[0]=name.trim();e.textContent=z[0]}
  };
  document.getElementById('lab').appendChild(e);
  z.e=e;
}

function ui(){
  const nav=document.getElementById('nav'),lab=document.getElementById('lab'),hint=document.getElementById('hint');
  presets.forEach(p=>{
    const b=document.createElement('button');b.textContent=p[0];
    b.onclick=()=>{controls.autoRotate=false;bA.classList.remove('on');fly(p[1],p[2])};
    nav.appendChild(b);
  });
  zones.forEach(addLabelEl);

  bR.onclick=()=>setMode('real');
  bY.onclick=()=>setMode('hybrid');
  bH.onclick=()=>setMode('holo');
  bA.onclick=()=>{controls.autoRotate=!controls.autoRotate;bA.classList.toggle('on',controls.autoRotate)};
  bL.onclick=()=>{showL=!showL;lab.style.display=showL?'block':'none';bL.classList.toggle('on',showL)};
  bP.onclick=()=>{placingPin=!placingPin;bP.classList.toggle('on',placingPin);hint.style.display=placingPin?'block':'none'};

  renderer.domElement.addEventListener('pointerdown',ev=>{
    if(!placingPin)return;
    mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hit=raycaster.intersectObjects(venue.children,true)[0];
    if(hit){
      const label=prompt('Enter label for this pin:','📍 Custom Area');
      if(label&&label.trim()){
        const p=hit.point,z=[label.trim(),p.x,p.y+2.5,p.z,[p.x+16,p.y+12,p.z+16],[p.x,p.y+1,p.z]];
        zones.push(z);addLabelEl(z);
      }
      placingPin=false;bP.classList.remove('on');hint.style.display='none';
    }
  });
}

const clk=new THREE.Clock(),tp=new V();
function animate(){
  requestAnimationFrame(animate);
  const t=clk.getElapsedTime();
  if(anim){
    anim.k=Math.min(anim.k+.03,1);
    const e=1-Math.pow(1-anim.k,3);
    camera.position.lerpVectors(anim.a,anim.b,e);
    controls.target.lerpVectors(anim.c,anim.d,e);
    if(anim.k>=1)anim=null;
  }
  cars.forEach(c=>{c.position.x+=c.userData.s;if(c.position.x>56)c.position.x=-62;if(c.position.x<-62)c.position.x=56});
  pl[1].intensity=2.2+Math.sin(t*7)*.15+Math.sin(t*13)*.1;
  pl[3].intensity=1.6+Math.sin(t*2)*.3;
  controls.update();
  composer.render();
  if(showL){
    zones.forEach(z=>{
      tp.set(z[1],z[2],z[3]).project(camera);
      z.e.style.opacity=tp.z>1?0:1;
      z.e.style.left=(tp.x*.5+.5)*innerWidth+'px';
      z.e.style.top=(-tp.y*.5+.5)*innerHeight+'px';
    });
  }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

const go=()=>init();
Promise.race([document.fonts.load('800 80px "Noto Sans Devanagari"'),new Promise(r=>setTimeout(r,1500))]).then(go,go);
</script>
</body>
</html>
